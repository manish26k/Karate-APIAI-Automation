name: Karate CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Execute Karate Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download Karate CLI
        run: |
          curl -LO "https://github.com/karatelabs/karate/releases/download/v2.1.3/karate-2.1.3.jar"

      - name: Run Smoke Tests (PR)
        if: github.event_name == 'pull_request'
        run: java -jar karate-2.1.3.jar run --tags @smoke -f html,junit:xml features/

      - name: Run Regression Tests (Main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: java -jar karate-2.1.3.jar run --tags @regression -f html,junit:xml features/

      - name: Upload Karate Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karate-reports
          path: target/karate-reports
          retention-days: 7

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan Repository for Secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy to GitHub Pages
    needs: [test, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download Reports
        uses: actions/download-artifact@v4
        with:
          name: karate-reports
          path: target/karate-reports

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Prepare Pages Directory
        run: |
          mkdir -p public/latest/karate
          cp -r target/karate-reports/* public/latest/karate/

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4